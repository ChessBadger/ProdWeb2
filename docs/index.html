<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Badger Inventory Service</title>
    <script>
      // Prevents Flash of Unstyled Content (FOUC)
      if (
        localStorage.getItem("theme") === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
    </script>
    <script>
      (() => {
        const productionFields = [
          "PiecesPerHr",
          "DollarPerHr",
          "SkusPerHr",
          "AVG_DELTA",
          "GAP5_COUNT",
          "GAP10_COUNT",
          "GAP15_COUNT",
        ];

        const isEmployeeProductionUrl = (input) => {
          const url = typeof input === "string" ? input : input?.url;
          return typeof url === "string" && url.includes("EmployeeProductionExport.json");
        };

        const isRx = (value) =>
          value === true ||
          value === 1 ||
          (typeof value === "string" &&
            ["true", "yes", "y", "1"].includes(value.trim().toLowerCase()));

        const omitRxProduction = (payload) => {
          Object.values(payload || {}).forEach((sheet) => {
            if (!Array.isArray(sheet)) return;
            sheet.forEach((row) => {
              if (!isRx(row?.Rx)) return;
              productionFields.forEach((field) => {
                if (field in row) row[field] = null;
              });
            });
          });
          return payload;
        };

        const originalFetch = window.fetch.bind(window);
        window.fetch = async (...args) => {
          const response = await originalFetch(...args);
          if (!isEmployeeProductionUrl(args[0])) return response;

          const data = omitRxProduction(await response.clone().json());
          return new Response(JSON.stringify(data), {
            status: response.status,
            statusText: response.statusText,
            headers: {
              "content-type": "application/json",
            },
          });
        };
      })();
    </script>

    <script type="importmap">
      {
        "imports": {
          "vite": "https://esm.sh/vite@^7.0.4",

          "react/": "https://esm.sh/react@^19.1.0/",
          "react": "https://esm.sh/react@^19.1.0",
          "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
          "recharts": "https://esm.sh/recharts@^3.1.0",
          "firebase/": "https://esm.sh/firebase@^11.10.0/"
        }
      }
    </script>
